const CATS = ['全部','廳院設備','倉庫與物品','值勤與工作流程','排練室','安全與門禁','行政事務'];
let activeCat = '全部', query = '';
function init() {
  const catDiv = document.getElementById('categories');
  CATS.forEach(c => { const btn = document.createElement('button'); btn.className = 'cat-btn' + (c === '全部' ? ' active' : ''); btn.setAttribute('data-cat', c); btn.textContent = c; btn.onclick = () => { activeCat = c; updateCats(); render(); }; catDiv.appendChild(btn); });
  document.getElementById('searchInput').addEventListener('input', e => { query = e.target.value.trim(); document.getElementById('clearBtn').style.display = query ? 'block' : 'none'; render(); });
  render();
}
function updateCats() { document.querySelectorAll('.cat-btn').forEach(btn => { btn.classList.toggle('active', btn.getAttribute('data-cat') === activeCat); }); }
function clearSearch() { document.getElementById('searchInput').value = ''; query = ''; document.getElementById('clearBtn').style.display = 'none'; render(); }
function matchItem(item, q) { if (!q) return true; var fields = [item.t, item.s, item.r, item.k, item.l || ''].join(' ').toLowerCase(); return q.toLowerCase().split(/\s+/).every(function(term) { return fields.includes(term); }); }
function highlightText(text, q) { if (!q) return text; var terms = q.toLowerCase().split(/\s+/).filter(Boolean); if (!terms.length) return text; var escaped = terms.map(function(t) { return t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }); return text.replace(new RegExp('(' + escaped.join('|') + ')', 'gi'), '<span class="highlight">$1</span>'); }
function render() {
  var list = document.getElementById('cardList'), badge = document.getElementById('countBadge');
  var filtered = DATA.filter(function(item) { if (activeCat !== '全部' && item.c !== activeCat) return false; return matchItem(item, query); });
  badge.textContent = '共 ' + filtered.length + ' 筆' + (query ? '（搜尋：' + query + '）' : '');
  if (!filtered.length) { list.innerHTML = '<div class="empty-state"><div class="emoji">🔍</div><p>找不到符合的結果<br>試試其他關鍵字或切換分類</p></div>'; return; }
  list.innerHTML = filtered.map(function(item) { var catClass = 'cat-' + item.c; var loc = item.l ? '<div class="card-location">📍 ' + highlightText(item.l, query) + '</div>' : ''; var date = item.d ? '<div class="card-detail-label">生效日期</div><div class="card-detail-text">' + item.d + '</div>' : ''; return '<div class="card" onclick="this.classList.toggle(\'expanded\')"><span class="card-cat ' + catClass + '">' + item.c + '</span><div class="card-title">' + highlightText(item.t, query) + '</div><div class="card-summary">' + highlightText(item.s, query) + '</div>' + loc + '<div class="card-expand-hint">點擊展開詳細規則 ▾</div><div class="card-detail"><div class="card-detail-label">目前規則</div><div class="card-detail-text">' + highlightText(item.r, query) + '</div>' + date + '<div class="card-detail-label">關鍵字</div><div class="card-detail-text">' + highlightText(item.k, query) + '</div></div></div>'; }).join('');
}
init();
</script>
